[project]
name = "bas-utils"
version = "0.1.0"
description = "Utilities for BAS operations including firm matching and data management"
requires-python = ">=3.13"
dependencies = [
    "duckdb>=1.4.3",
    "python-dotenv>=1.0.0",
    "pandas>=2.0.0",
    "unidecode>=1.3.0",
    "requests>=2.32.5",
    "pydantic>=2.12.5",
    "ipykernel>=7.2.0",
]

[project.optional-dependencies]
address-matching = [
    "postal>=1.0.0",
]
google-sheets = [
    "gspread>=6.0.0",
    "google-auth>=2.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["merge_tables", "zoho"]

[tool.uv]
dev-dependencies = []
